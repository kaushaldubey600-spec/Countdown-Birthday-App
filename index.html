
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Countdown App | TechByKD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="emoji">🎉 🎈</div>

    <h1>Birthday Countdown</h1>
    <p class="subtitle">Let's count down to your special day!</p>

    <div class="form" id="birthdayForm">
      <input type="text" id="name" placeholder="Enter your name">
      <input type="date" id="birthday">
      <button id="startBtn">Start Countdown</button>
    </div>

    <div class="countdown-section" id="countdownSection" hidden>
      <h2 id="greeting">Your Birthday is Coming!</h2>

      <div class="countdown">
        <div class="time-box">
          <span id="days">00</span>
          <small>Days</small>
        </div>
        <div class="time-box">
          <span id="hours">00</span>
          <small>Hours</small>
        </div>
        <div class="time-box">
          <span id="minutes">00</span>
          <small>Minutes</small>
        </div>
        <div class="time-box">
          <span id="seconds">00</span>
          <small>Seconds</small>
        </div>
      </div>

      <p id="message">Your special day is getting closer!</p>
      <button id="resetBtn" class="reset-btn">Set Another Birthday</button>
    </div>

    <footer>Made with ❤️ by TechByKD</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
